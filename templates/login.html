<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

    <!-- Toast Notification System -->
    <div class="toast-container" id="toastContainer">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast toast-{{ category }}">
                        <span class="toast-icon"></span>
                        <span class="toast-msg">{{ message }}</span>
                        <button type="button" class="toast-close" onclick="this.parentElement.remove()">×</button>
                        <div class="toast-progress"></div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">💰</div>
                <h1>Welcome Back</h1>
                <p>Log in to access your personal expense manager</p>
            </div>

            <form action="/login" method="POST" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="username_or_email">Username or Email</label>
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username_or_email" name="username_or_email" placeholder="Enter username or email" required autofocus autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    Sign In ➔
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup" class="auth-link">Create Account</a></p>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach(t => {
                t.classList.add('hiding');
                setTimeout(() => t.remove(), 250);
            });
        }, 3500);
    </script>
</body>

</html>
